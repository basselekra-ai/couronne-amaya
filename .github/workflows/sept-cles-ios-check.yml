# Les 7 Clés du Griot : vérifie que le projet iOS compile (sans signature, pour le simulateur).
# La publication sur l'App Store se fait ensuite depuis Xcode sur un Mac (voir sept-cles-du-griot/README.md).
name: 7 Clés du Griot · iOS (vérification)

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: sept-cles-du-griot

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sept-cles-du-griot/package-lock.json
      - run: npm ci
      - run: npm run sync
      - name: Compiler pour le simulateur
        working-directory: sept-cles-du-griot/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
