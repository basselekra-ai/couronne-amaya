<title>La Couronne d'Amaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-screen column — HUD band, square board, booster tray. Screens stack absolutely; overlays sit above. */
:root{
  --night:#140f2b;
  --plum:#2b1c4f;
  --lagoon:#1f6a78;
  --gold:#ffcb52;
  --gold-deep:#b97813;
  --coral:#ff6b57;
  --ink:#fff6e8;
  --muted:#cdc1ea;
  --danger:#ff2e55;
  --umbra:#8a3be0;
  --good:#7dffa8;
  --panel:rgba(24,16,52,.84);
  --panel-line:rgba(255,203,82,.42);
  --f-display:"Lilita One","Trebuchet MS","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{position:relative;height:100%;overflow:hidden;background:radial-gradient(130% 75% at 50% 0%,#20606f 0%,#2a1d50 48%,var(--night) 100%)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-inline:16px;padding-block:10px}

/* ---------- buttons ---------- */
.btn{font-family:var(--f-display);font-size:20px;letter-spacing:.02em;padding:12px 28px;border-radius:999px;color:#4a2705;
  background:linear-gradient(180deg,#fff0b0 0%,var(--gold) 45%,#f0a52a 100%);box-shadow:0 5px 0 var(--gold-deep),0 10px 22px rgba(0,0,0,.35);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--gold-deep),0 4px 10px rgba(0,0,0,.35)}
.btn.big{font-size:28px;padding:14px 46px}
.btn.coral{color:#fff;background:linear-gradient(180deg,#ffa08f,var(--coral) 50%,#e0412f);box-shadow:0 5px 0 #a3271a,0 10px 22px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.2)}
.btn.ghost{color:var(--ink);background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.btn.ghost:active{transform:translateY(2px)}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--panel-line)}
.icon-btn svg{width:22px;height:22px}
.icon-btn.off{opacity:.45}

/* ---------- title ---------- */
#scr-title{justify-content:center;text-align:center}
.title-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:440px;position:relative;z-index:1}
.title-portrait{width:min(230px,52vw);aspect-ratio:1;max-width:100%;border-radius:50%;border:5px solid var(--gold);box-shadow:0 0 0 8px rgba(255,203,82,.15),0 0 60px rgba(255,180,80,.35);overflow:hidden;animation:breathe 4s ease-in-out infinite}
.logo{margin:0;font-family:var(--f-display);font-weight:400;line-height:.9;text-wrap:balance;display:flex;flex-direction:column;color:var(--gold);
  text-shadow:0 3px 0 var(--gold-deep),0 6px 0 #5a2f06,0 12px 28px rgba(0,0,0,.5)}
.logo span:first-child{font-size:clamp(30px,8vw,44px);color:var(--ink);text-shadow:0 3px 0 #6b3fa8,0 8px 20px rgba(0,0,0,.45)}
.logo span:last-child{font-size:clamp(50px,14vw,76px)}
.tag{margin:0;color:var(--muted);font-weight:700;font-size:16px;line-height:1.4;max-width:30ch}
.title-actions{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.progress-line{margin:0;font-size:13px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 3px rgba(255,203,82,.6);opacity:.0;animation:mote 9s linear infinite}
@keyframes mote{0%{transform:translateY(20px) scale(.6);opacity:0}15%{opacity:.85}100%{transform:translateY(-110vh) scale(1.1);opacity:0}}
@keyframes breathe{50%{transform:scale(1.025)}}

/* ---------- map ---------- */
.map-col{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;gap:10px;min-height:0}
.map-head{display:flex;align-items:center;gap:12px}
.map-head h2{flex:1;margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--gold);text-shadow:0 3px 0 #5a2f06}
.stars-total{font-family:var(--f-display);font-size:20px;background:var(--panel);border:1.5px solid var(--panel-line);border-radius:999px;padding:6px 14px;color:var(--gold)}
.stars-total b{color:var(--ink);font-weight:400}
.map-scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:30px;scrollbar-width:thin}
.chapter{margin-top:14px;padding:16px;border-radius:24px;background:var(--panel);border:1.5px solid var(--panel-line);position:relative;overflow:hidden}
.chapter::before{content:"";position:absolute;inset:0;background:var(--chbg);opacity:.5;pointer-events:none}
.chapter > *{position:relative}
.ch-eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.ch-title{margin:2px 0 4px;font-family:var(--f-display);font-weight:400;font-size:24px;text-wrap:balance}
.ch-desc{margin:0 0 10px;color:var(--muted);font-weight:700;font-size:14px;line-height:1.4;max-width:46ch}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;padding-block:6px;position:relative}
.path::before{content:"";position:absolute;top:20px;bottom:20px;left:50%;border-left:4px dotted rgba(255,203,82,.35);transform:translateX(-50%)}
.node-row{position:relative;display:flex;align-items:center;gap:10px}
.node{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:#4a2705;
  background:radial-gradient(circle at 35% 30%,#fff5c8,var(--gold) 50%,var(--gold-deep));box-shadow:0 5px 0 #7a4a08,0 8px 18px rgba(0,0,0,.4)}
.node.boss{width:78px;height:78px;color:#fff;background:radial-gradient(circle at 35% 30%,#d9a8ff,var(--umbra) 50%,#3b1068);box-shadow:0 5px 0 #26073f,0 0 26px rgba(160,80,255,.55)}
.node.locked{color:rgba(255,255,255,.6);background:radial-gradient(circle at 35% 30%,#6c6390,#3c345e 60%,#29223f);box-shadow:0 5px 0 #1a1530;cursor:default}
.node.current{animation:nodepulse 1.4s ease-in-out infinite}
@keyframes nodepulse{50%{transform:scale(1.09)}}
.node svg.lock{width:24px;height:24px}
.node-stars{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);display:flex;gap:1px;font-size:15px;line-height:1;color:rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.2)}
.node-stars .on{color:var(--gold);text-shadow:0 1px 0 #7a4a08}
.node-label{font-weight:800;font-size:13px;color:var(--ink);width:110px;line-height:1.2}
.node-row .spacer{width:110px}
.node-hero{position:absolute;width:40px;height:40px;border-radius:50%;border:2.5px solid var(--gold);overflow:hidden;top:50%;margin-top:-20px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* ---------- game ---------- */
#scr-game{padding-block:8px}
#scr-game .col{width:100%;max-width:560px;height:100%;display:flex;flex-direction:column;gap:8px;min-height:0;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:8px}
.lvl-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.lvl-title small{font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.lvl-title span{font-family:var(--f-display);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-family:var(--f-display);font-size:18px;background:var(--panel);border:1.5px solid var(--panel-line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--panel-line);border-radius:20px;padding:8px 10px;position:relative}
.goals{display:flex;flex-wrap:wrap;gap:4px 10px;min-width:0}
.goal{display:flex;align-items:center;gap:3px;font-family:var(--f-display);font-size:21px;font-variant-numeric:tabular-nums}
.goal img{width:32px;height:32px;flex:none}
.goal.bump img{animation:gbump .3s}
@keyframes gbump{50%{transform:scale(1.35)}}
.goal.done b{color:var(--good)}
.goal.rise b{color:#ff9bb0;animation:gbump .4s}
.goals-label{width:100%;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.moves{width:78px;height:78px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#4a2705;
  background:radial-gradient(circle at 35% 28%,#fff6cf,var(--gold) 46%,var(--gold-deep));box-shadow:0 4px 0 #7a4a08,inset 0 -4px 10px rgba(122,74,8,.35)}
.moves small{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.moves b{font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.danger .moves{color:#fff;background:radial-gradient(circle at 35% 28%,#ffb3c1,var(--danger) 48%,#8f0a26);box-shadow:0 4px 0 #5c0418,0 0 24px rgba(255,46,85,.6);animation:heartbeat .9s infinite}
.panic .moves{animation-duration:.55s}
@keyframes heartbeat{0%,100%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(1)}36%{transform:scale(1.08)}}
.hero{justify-self:end;position:relative}
.portrait{width:70px;height:70px;border-radius:50%;border:3px solid var(--gold);overflow:hidden;background:#0f4d5c;transition:transform .2s}
.portrait svg,.title-portrait svg,.d-portrait svg,.node-hero svg,.mini-portrait svg{display:block;width:100%;height:100%}
.portrait.jump{animation:pjump .5s}
@keyframes pjump{40%{transform:translateY(-8px) scale(1.06)}}
.danger .portrait{border-color:var(--danger)}
.bubble{position:absolute;right:-4px;top:calc(100% + 8px);width:max-content;max-width:min(230px,60vw);background:var(--ink);color:#2a1840;font-weight:800;font-size:14px;line-height:1.3;padding:8px 12px;border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.35);opacity:0;transform:translateY(-6px) scale(.95);transform-origin:top right;transition:opacity .2s,transform .2s;pointer-events:none;z-index:20}
.bubble::before{content:"";position:absolute;top:-7px;right:28px;border:8px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.bubble.show{opacity:1;transform:none}
.bubble.villain{background:#2a0f45;color:#e9cfff;box-shadow:0 0 0 2px var(--umbra),0 8px 20px rgba(0,0,0,.45)}
.bubble.villain::before{border-bottom-color:#2a0f45}
.threat{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:14px;color:#ecd4ff;background:linear-gradient(90deg,rgba(138,59,224,0),rgba(138,59,224,.45),rgba(138,59,224,0));padding:4px 10px;border-radius:999px}
.threat b{font-family:var(--f-display);font-weight:400;font-size:18px;color:#fff}
.threat.imminent{animation:threatflash .6s infinite alternate}
@keyframes threatflash{to{background:linear-gradient(90deg,rgba(255,46,85,0),rgba(255,46,85,.55),rgba(255,46,85,0))}}
#boardWrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#board{display:block;touch-action:none;border-radius:18px;box-shadow:0 0 0 3px rgba(255,203,82,.55),0 0 0 7px rgba(24,16,52,.9),0 18px 40px rgba(0,0,0,.5)}
.hammer #board{cursor:crosshair;box-shadow:0 0 0 3px var(--coral),0 0 0 7px rgba(24,16,52,.9),0 0 34px rgba(255,107,87,.5)}
.boosters{display:flex;justify-content:center;gap:14px;padding-bottom:2px}
.booster{position:relative;width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--panel);border:1.5px solid var(--panel-line);transition:transform .12s}
.booster svg{width:32px;height:32px}
.booster:active{transform:scale(.94)}
.booster.active{border-color:var(--coral);box-shadow:0 0 0 3px rgba(255,107,87,.4)}
.booster[disabled]{opacity:.4;cursor:default}
.booster .cnt{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--coral);color:#fff;font-family:var(--f-display);font-size:14px;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 0 #a3271a}
.booster-tip{align-self:center;font-size:12px;font-weight:800;color:var(--muted);min-height:16px;text-align:center}
#scr-game::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 rgba(255,30,70,0);transition:box-shadow .4s;z-index:0}
#scr-game.danger::after{animation:vignette 1s ease-in-out infinite}
#scr-game.panic::after{animation-duration:.6s}
@keyframes vignette{0%,100%{box-shadow:inset 0 0 60px rgba(255,30,70,.25)}50%{box-shadow:inset 0 0 150px rgba(255,30,70,.6)}}
.praise{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(40px,11vw,64px);color:var(--gold);white-space:nowrap;pointer-events:none;z-index:10;
  text-shadow:0 3px 0 #a3271a,0 6px 0 #4a1408,0 10px 30px rgba(0,0,0,.6);animation:praise 1.1s cubic-bezier(.2,1.4,.4,1) forwards}
.praise.violet{color:#e9cfff;text-shadow:0 3px 0 #6a1fb5,0 6px 0 #2a0b4a,0 10px 30px rgba(0,0,0,.6)}
.praise.red{color:#fff;text-shadow:0 3px 0 #c4122f,0 6px 0 #5c0418,0 10px 30px rgba(0,0,0,.6)}
.praise.small{font-size:clamp(26px,7vw,38px)}
@keyframes praise{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1.08) rotate(2deg);opacity:1}70%{transform:translate(-50%,-55%) scale(1);opacity:1}100%{transform:translate(-50%,-75%) scale(.9);opacity:0}}
.fly{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.toast{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:var(--panel);border:1.5px solid var(--panel-line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:14px;z-index:12;white-space:nowrap;animation:toast 2s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* ---------- overlays ---------- */
#overlay{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,5,20,.68);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#overlay.dialog-mode{align-items:flex-end;background:linear-gradient(180deg,rgba(8,5,20,.15),rgba(8,5,20,.8))}
.modal{width:100%;max-width:420px;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#3d2675,#1d1440);border:2px solid var(--gold);border-radius:26px;padding:22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.modal h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:32px;color:var(--gold);text-shadow:0 3px 0 #5a2f06;text-wrap:balance}
.modal .eyebrow{font-size:12px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.modal p{margin:8px auto 0;color:var(--muted);font-weight:700;line-height:1.45;max-width:34ch}
.modal .actions{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:18px}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.goal-cards{display:flex;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
.goal-card{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(0,0,0,.25);border-radius:16px;padding:10px 12px;min-width:72px}
.goal-card img{width:44px;height:44px}
.goal-card b{font-family:var(--f-display);font-weight:400;font-size:22px}
.goal-card span{font-size:11px;font-weight:800;color:var(--muted)}
.warn{margin-top:12px;display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:#ecd4ff;background:rgba(138,59,224,.3);border:1.5px solid var(--umbra);border-radius:14px;padding:8px 12px;text-align:left;line-height:1.35}
.big-stars{display:flex;justify-content:center;gap:6px;margin:12px 0 4px}
.big-stars i{font-style:normal;font-size:56px;line-height:1;color:rgba(255,255,255,.16);transform:scale(.4);opacity:0;animation:starin .5s cubic-bezier(.2,1.6,.4,1) forwards}
.big-stars i:nth-child(2){font-size:70px;margin-top:-10px}
.big-stars i.on{color:var(--gold);text-shadow:0 4px 0 #a36508,0 0 24px rgba(255,203,82,.7)}
@keyframes starin{to{transform:scale(1);opacity:1}}
.final-score{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums}
.mini-portrait{width:96px;height:96px;margin:0 auto 8px;border-radius:50%;border:3px solid var(--gold);overflow:hidden}
.ad-msg{font-size:13px!important;color:var(--muted)}
.link-btn{font-weight:800;font-size:14px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;padding:6px 10px}
.sync-status{display:flex;gap:10px;align-items:flex-start;text-align:left;background:rgba(0,0,0,.25);border-radius:14px;padding:10px 12px;font-size:14px}
.sync-status .dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--gold)}
.sync-status.on .dot{background:var(--good);box-shadow:0 0 10px var(--good)}
.save-block{display:flex;flex-direction:column;gap:8px;margin-top:16px;text-align:left}
.save-block label{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.save-block textarea{width:100%;box-sizing:border-box;resize:none;font:600 13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:rgba(0,0,0,.35);border:1.5px solid var(--panel-line);border-radius:12px;padding:10px;word-break:break-all;-webkit-user-select:text;user-select:text}
.save-block textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.save-block .btn{align-self:center;font-size:17px;padding:10px 22px}
.save-msg{min-height:1.2em;margin:0!important;font-size:14px;color:var(--ink)!important;text-align:center;max-width:none!important}
.toggles{display:flex;gap:10px;justify-content:center;margin-top:14px}
.toggles button{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-weight:800}
.toggles button svg{width:20px;height:20px}
.toggles button[aria-pressed="false"]{opacity:.5}

.dialog{width:100%;max-width:560px;display:flex;align-items:flex-end;gap:12px;margin-bottom:20px;cursor:pointer;animation:slideup .35s ease-out}
@keyframes slideup{from{transform:translateY(30px);opacity:0}}
.d-portrait{flex:none;width:clamp(96px,28vw,140px);aspect-ratio:1;border-radius:50%;border:4px solid var(--gold);overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pjump .5s}
.d-portrait.villain{border-color:var(--umbra);box-shadow:0 0 30px rgba(138,59,224,.6)}
.d-box{flex:1;min-width:0;background:var(--ink);color:#2a1840;border-radius:22px 22px 22px 6px;padding:14px 16px 12px;box-shadow:0 14px 34px rgba(0,0,0,.5);position:relative}
.d-box.villain{background:#24103d;color:#ecd8ff;box-shadow:0 0 0 2px var(--umbra),0 14px 34px rgba(0,0,0,.5)}
.d-box.tip{background:linear-gradient(180deg,#fff6d8,#ffe7a6)}
.d-name{font-family:var(--f-display);font-size:20px;color:var(--coral)}
.d-box.villain .d-name{color:#c99bff}
.d-box.tip .d-name{color:var(--gold-deep)}
.d-text{margin:4px 0 6px;font-weight:700;font-size:16px;line-height:1.45;min-height:3em}
.d-next{display:block;text-align:right;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;opacity:.55}
.d-skip{position:absolute;top:16px;right:16px;z-index:2}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media (max-height:640px){
  .moves{width:64px;height:64px}.moves b{font-size:28px}
  .portrait{width:56px;height:56px}
  .booster{width:50px;height:50px}.booster svg{width:28px;height:28px}

<script>
'use strict';
(() => {
const N = 8;
const K = (r, c) => r * N + c, R = k => (k / N) | 0, C = k => k % N;
const $ = s => document.querySelector(s);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let turbo = false;

/* =========================================================
   Sauvegarde
   ========================================================= */
const SAVE_KEY = 'couronne-amaya-v1';
const DEFAULT_SAVE = { unlocked: 1, stars: {}, best: {}, hammer: 2, shuffle: 1, music: true, sfx: true, seen: {} };
let save = Object.assign({}, DEFAULT_SAVE, readSave());
function readSave() { try { const v = localStorage.getItem(SAVE_KEY); return v ? JSON.parse(v) : {}; } catch (e) { return {}; } }
function persist() {
  save.updated = Date.now();
  const json = JSON.stringify(save);
  try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
  const Pref = nativePrefs();
  if (Pref) Pref.set({ key: SAVE_KEY, value: json }).catch(() => {});
  Sync.schedule();
}

/* ---------- Publicités (application mobile uniquement, jamais obligatoires) ----------
   - vidéo « avec récompense » : le joueur CHOISIT de la regarder pour gagner 5 coups (après le +5 gratuit)
   - publicité plein écran entre deux niveaux : au plus une tous les 3 niveaux gagnés et toutes les 3 minutes,
     jamais pendant les premiers niveaux. Rien ne s'affiche dans la version web.
   Les identifiants viennent de ads.config.json (injectés par le script de construction). */
const Ads = {
  plugin: null, cfg: null, ready: false, privacy: false, rewardLoaded: false, interLoaded: false, wins: 0, lastInter: 0, busy: false,
  ids() { return this.cfg[window.Capacitor?.getPlatform?.() === 'ios' ? 'ios' : 'android']; },
  async init() {
    try {
      this.plugin = window.AmayaNative?.AdMob || null; this.cfg = window.AMAYA_ADS || null;
      if (!this.plugin || !this.cfg) return;
      await this.plugin.initialize({ initializeForTesting: !!this.cfg.test });
      // Consentement (obligatoire en Europe et au Royaume-Uni) : formulaire officiel de Google, seulement là où la loi l'exige
      let info = await this.plugin.requestConsentInfo();
      if (info.isConsentFormAvailable && info.status === 'REQUIRED') info = await this.plugin.showConsentForm();
      this.privacy = info.privacyOptionsRequirementStatus === 'REQUIRED';
      if (info.canRequestAds === false) return;
      this.ready = true;
      this.loadReward(); this.loadInter();
    } catch (e) { this.ready = false; }
  },
  async loadReward() {
    if (!this.ready || this.rewardLoaded) return;
    try { await this.plugin.prepareRewardVideoAd({ adId: this.ids().rewarded, isTesting: !!this.cfg.test }); this.rewardLoaded = true; }
    catch (e) { this.rewardLoaded = false; setTimeout(() => this.loadReward(), 60000); }
  },
  async loadInter() {
    if (!this.ready || this.interLoaded) return;
    try { await this.plugin.prepareInterstitial({ adId: this.ids().interstitial, isTesting: !!this.cfg.test }); this.interLoaded = true; }
    catch (e) { this.interLoaded = false; setTimeout(() => this.loadInter(), 60000); }
  },
  hasReward() { return this.ready && this.rewardLoaded && !this.busy; },
  /* Affiche une publicité plein écran ; se termine quand le joueur la ferme */
  async show(kind) {
    this.busy = true; AU.setMusic(false);
    const events = kind === 'reward'
      ? { reward: 'onRewardedVideoAdReward', end: ['onRewardedVideoAdDismissed', 'onRewardedVideoAdFailedToShow'] }
      : { end: ['interstitialAdDismissed', 'interstitialAdFailedToShow'] };
    let earned = false; const handles = [];
    try {
      await new Promise(async resolve => {
        const stop = setTimeout(resolve, 150000);
        const done = () => { clearTimeout(stop); setTimeout(resolve, 60); };
        try {
          if (events.reward) handles.push(await this.plugin.addListener(events.reward, () => { earned = true; }));
          for (const ev of events.end) handles.push(await this.plugin.addListener(ev, done));
          if (kind === 'reward') { const r = await this.plugin.showRewardVideoAd(); if (r) earned = true; }
          else await this.plugin.showInterstitial();
        } catch (e) { done(); }
      });
    } finally {
      for (const h of handles) try { h.remove(); } catch (e) {}
      this.busy = false; AU.setMusic(save.music);
    }
    return earned;
  },
  /* Vidéo avec récompense : renvoie true seulement si le joueur l'a regardée jusqu'au bout */
  async watchForReward() {
    if (!this.hasReward()) return false;
    this.rewardLoaded = false;
    const ok = await this.show('reward');
    this.loadReward();
    return ok;
  },
  /* Appelée au passage au niveau suivant */
  async betweenLevels(n) {
    if (!this.ready) return;
    this.wins++;
    const c = this.cfg;
    if (!this.interLoaded || this.busy || n < c.from || this.wins % c.every !== 0 || Date.now() - this.lastInter < c.gap * 1000) return;
    this.interLoaded = false;
    await this.show('inter');
    this.lastInter = Date.now();
    this.loadInter();
  },
  privacyForm() { try { return this.plugin.showPrivacyOptionsForm(); } catch (e) { return Promise.resolve(); } },
};

/* ---------- Synchronisation ----------
   1. Application mobile : stockage natif (Capacitor Preferences), qui survit au nettoyage du navigateur.
   2. Page claude.ai : sauvegarde privée par joueur dans la base de l'artifact, retrouvée sur tous ses appareils.
   3. Partout : un code de transfert à copier d'un appareil à l'autre.
   Les fusions gardent toujours la meilleure progression des deux côtés. */
function nativePrefs() { try { return window.AmayaNative?.Preferences || null; } catch (e) { return null; } }
function mergeSave(a, b) {
  if (!b || typeof b !== 'object') return a;
  const out = Object.assign({}, a);
  out.unlocked = Math.max(+a.unlocked || 1, +b.unlocked || 1);
  for (const key of ['stars', 'best', 'seen']) {
    out[key] = Object.assign({}, a[key]);
    for (const [k, v] of Object.entries(b[key] || {})) if (typeof v === 'number') out[key][k] = Math.max(out[key][k] || 0, v);
  }
  out.hammer = Math.max(+a.hammer || 0, +b.hammer || 0);
  out.shuffle = Math.max(+a.shuffle || 0, +b.shuffle || 0);
  out.updated = Math.max(+a.updated || 0, +b.updated || 0);
  return out;
}
function sameProgress(a, b) { return ['unlocked', 'stars', 'best', 'seen', 'hammer', 'shuffle'].every(k => JSON.stringify(a[k]) === JSON.stringify(b[k])); }
const Sync = {
  ref: null, state: 'local', timer: 0, writing: false, again: false,
  async init() {
    const Pref = nativePrefs();
    if (Pref) {
      this.state = 'device';
      try { const r = await Pref.get({ key: SAVE_KEY }); if (r && r.value) this.adopt(JSON.parse(r.value)); } catch (e) {}
      persistQuiet();
    }
    if (!window.claude || typeof window.claude.use !== 'function') return;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.ref = db.doc('data/users/' + id + '/progress');
      const snap = await this.ref.get();
      if (snap.exists && snap.data().save) this.adopt(snap.data().save);
      this.state = 'cloud';
      this.push();
    } catch (e) { this.ref = null; }
    refreshSyncUI();
  },
  adopt(other) {
    const merged = mergeSave(save, other);
    if (!sameProgress(save, merged)) { save = merged; persistQuiet(); onSaveChanged(); }
  },
  schedule() { if (!this.ref) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 1500); },
  async push() {
    if (!this.ref) return;
    if (this.writing) { this.again = true; return; }
    this.writing = true;
    try {
      const body = JSON.parse(JSON.stringify(save));
      await this.ref.set({ save: body, updated: body.updated || Date.now() });
      this.state = 'cloud';
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'not_granted' || e.code === 'revoked')) { this.ref = null; this.state = 'local'; }
    }
    this.writing = false;
    refreshSyncUI();
    if (this.again) { this.again = false; this.push(); }
  },
};
function persistQuiet() {
  const json = JSON.stringify(save);
  try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
  const Pref = nativePrefs(); if (Pref) Pref.set({ key: SAVE_KEY, value: json }).catch(() => {});
}
function onSaveChanged() {
  if (typeof showTitle !== 'function') return;
  if (!$('#scr-title').hidden) showTitle();
  else if (!$('#scr-map').hidden) showMap();
}
/* Code de transfert : AMY1-<données>-<contrôle> */
function b64urlEncode(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64urlDecode(str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); }
function checksum(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36).slice(0, 5).toUpperCase(); }
function exportCode() {
  const compact = { u: save.unlocked, s: save.stars, b: save.best, e: save.seen, h: save.hammer, m: save.shuffle };
  const data = b64urlEncode(JSON.stringify(compact));
  return 'AMY1-' + data + '-' + checksum(data);
}
function importCode(code) {
  const clean = String(code || '').replace(/\s+/g, '');
  const m = /^AMY1-([A-Za-z0-9_-]+)-([A-Z0-9]{1,5})$/.exec(clean);
  if (!m) throw new Error('format');
  if (checksum(m[1]) !== m[2]) throw new Error('checksum');
  const c = JSON.parse(b64urlDecode(m[1]));
  const n = o => { const r = {}; for (const [k, v] of Object.entries(o || {})) if (/^\d{1,5}$/.test(k) && typeof v === 'number' && isFinite(v)) r[k] = v; return r; };
  return { unlocked: Math.max(1, Math.min(99999, +c.u || 1)), stars: n(c.s), best: n(c.b), seen: n(c.e), hammer: Math.max(0, Math.min(99, +c.h || 0)), shuffle: Math.max(0, Math.min(99, +c.m || 0)) };
}

const ENDLESS_NAMES = ['Le bois des murmures', 'La crique aux lanternes', 'Le pont des alizés', 'La forêt de corail', 'Le phare oublié', 'Les dunes d’argent', 'Le lac miroir', 'La cité suspendue', 'Le col des tambours', 'La baie des tortues', 'Le verger de lune', 'Les grottes chantantes'];

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function getLevel(n) {
  if (n <= LEVELS.length) return LEVELS[n - 1];
  const i = n - LEVELS.length - 1, rnd = rng(n * 7919), kind = i % 4, tier = Math.min(10, Math.floor(i / 4));
  const def = { name: ENDLESS_NAMES[i % ENDLESS_NAMES.length], ch: 3, colors: i % 3 === 2 ? 6 : 5, moves: 24, goals: [] };
  const blank = () => Array.from({ length: N }, () => Array(N).fill('.'));
  const toMap = g => g.map(r => r.join(''));
  if (kind === 0) {
    const a = Math.floor(rnd() * def.colors); let b = Math.floor(rnd() * def.colors); if (b === a) b = (a + 1) % def.colors;
    def.goals = [[a, 18 + tier * 2], [b, 18 + tier * 2]]; def.moves = 17;
  } else if (kind === 1 || kind === 3) {
    const g = blank(), target = kind === 3 ? 12 + tier : 18 + tier * 2;
    let count = 0, guard = 0;
    while (count < target && guard++ < 500) {
      const r = Math.floor(rnd() * N), c = Math.floor(rnd() * 4);
      if (g[r][c] === '.') { g[r][c] = 's'; g[r][N - 1 - c] = 's'; count += 2; }
    }
    def.map = toMap(g); def.moves = kind === 3 ? 21 : 18;
    if (kind === 3) { def.spread = 2; def.boss = true; def.name = 'Le retour des ombres'; }
  } else {
    const g = blank(); let count = 0, guard = 0;
    while (count < 10 + tier && guard++ < 500) {
      const r = 1 + Math.floor(rnd() * 6), c = Math.floor(rnd() * 4);
      if (g[r][c] === '.') { g[r][c] = 'c'; g[r][N - 1 - c] = 'c'; count += 2; }
    }
    def.map = toMap(g); def.goals = [[Math.floor(rnd() * def.colors), 14 + tier]]; def.moves = 22;
  }
  return def;
}

    const q = f.p, px = f.fx + (f.tx - f.fx) * q, py = f.fy + (f.ty - f.fy) * q - Math.sin(q * Math.PI) * cs * 2;
    const s = cs * (1.1 + Math.sin(q * Math.PI) * .5);
    x.save(); x.translate(px, py); x.scale(f.tx < f.fx ? -1 : 1, 1 + Math.sin(now / 40) * .12);
    x.globalAlpha = .35; x.drawImage(sprites.bird, -s / 2 - cs * .25, -s / 2 + cs * .1, s, s); x.globalAlpha = 1;
    x.drawImage(sprites.bird, -s / 2, -s / 2, s, s); x.restore();
  } else if (f.type === 'text') {
    x.save(); x.globalAlpha = 1 - p; x.font = `${Math.round(cs * .5)}px "Lilita One", sans-serif`; x.textAlign = 'center';
    x.lineWidth = 4; x.strokeStyle = 'rgba(0,0,0,.6)'; x.strokeText(f.txt, f.x, f.y - p * cs); x.fillStyle = f.color; x.fillText(f.txt, f.x, f.y - p * cs); x.restore();
  }
}
function layout() {
  const wrap = $('#boardWrap');
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const size = Math.max(200, Math.floor(Math.min(w, h) - 10));
  const newDpr = Math.min(2.5, window.devicePixelRatio || 1);
  if (size === boardPx && newDpr === dpr && Object.keys(sprites).length) return;
  boardPx = size; cell = size / N; dpr = newDpr;
  canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr);
  canvas.style.width = size + 'px'; canvas.style.height = size + 'px';
  buildSprites(Math.round(cell * dpr));
}

/* =========================================================
   Entrées
   ========================================================= */
let drag = null;
function cellFromEvent(e) {
  const r = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - r.left) / cell), rr = Math.floor((e.clientY - r.top) / cell);
  return inB(rr, c) ? K(rr, c) : null;
}
function bindInput() {
  canvas.addEventListener('pointerdown', e => {
    AU.init();
    if (!G || G.busy || G.ended) return;
    const k = cellFromEvent(e); if (k == null) return;
    drag = { k, x: e.clientX, y: e.clientY, moved: false };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag || drag.moved || !G || G.busy || G.hammer) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < cell * .32) return;
    drag.moved = true;
    const r = R(drag.k), c = C(drag.k);
    const [r2, c2] = Math.abs(dx) > Math.abs(dy) ? [r, c + Math.sign(dx)] : [r + Math.sign(dy), c];
    if (inB(r2, c2)) trySwap(drag.k, K(r2, c2));
  });
  const end = () => {
    if (!drag) return;
    const d = drag; drag = null;
    if (!d.moved) tapCell(d.k);
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', () => { drag = null; });
}
function tapCell(k) {
  if (!G || G.busy || G.ended) return;
  const t = tileAt(k); if (!t) return;
  if (G.hammer) { useHammer(k); return; }
  if (G.sel != null) {
    const s = G.sel;
    if (s === k) { G.sel = null; if (t.s) tapSpecial(k); return; }
    if (Math.abs(R(s) - R(k)) + Math.abs(C(s) - C(k)) === 1) { G.sel = null; trySwap(s, k); return; }
  }
  if (t.s) { tapSpecial(k); return; }
  G.sel = k; AU.click();
}

    overlay.hidden = false; overlay.className = 'dialog-mode';
    const finish = () => { clearInterval(typing); closeOverlay(); resolve(); };
    const show = () => {
      const L = lines[i];
      const villain = L.who === 'morvane', tip = L.who === 'tip';
      overlay.innerHTML = `<button class="btn ghost d-skip" id="dSkip">Passer</button>
        <div class="dialog" id="dlg" role="dialog" aria-live="polite">

      else typing = setInterval(() => { n += 2; el.textContent = full.slice(0, n); if (n >= full.length) { clearInterval(typing); typing = null; } }, 22);
